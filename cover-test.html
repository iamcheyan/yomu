<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yomu cover state test</title>
    <style>
        :root { color-scheme: light; --bg: #f4ead2; --ink: #332d24; --muted: #9a8d74; --line: #b9ad96; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 48px; background: var(--bg); color: var(--ink); font-family: Georgia, "Noto Serif JP", serif; }
        header { max-width: 1180px; margin: 0 auto 38px; }
        h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: .08em; }
        p { margin: 0; color: var(--muted); font-family: system-ui, sans-serif; }
        .states { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 28px; align-items: start; }
        .state { min-width: 0; }
        .state-name { margin: 14px 0 5px; font-size: 17px; font-weight: 600; }
        .state-note { font-size: 12px; line-height: 1.6; }
        .book { position: relative; aspect-ratio: 1.18 / 1; min-height: 210px; }
        .closed-cover { position: absolute; inset: 8% 18%; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; background: #d9dde3; border: 1px solid #78818b; box-shadow: 5px 5px 0 #c2c5c9; }
        .closed-cover::after { position: absolute; inset: 9px; border: 1px solid #9ba2aa; content: ""; }
        .closed-cover span { position: relative; z-index: 1; }
        .closed-title { align-self: center; margin: auto 0; font-size: 25px; font-weight: 700; }
        .open-book { position: absolute; inset: 17% 2% 8%; display: flex; filter: drop-shadow(4px 5px 0 rgba(70, 60, 45, .18)); }
        .page { position: relative; flex: 1; overflow: hidden; background: #eee7d7; border: 1px solid #9f927a; }
        .page.left { border-radius: 8px 2px 2px 8px; transform: skewY(2deg); transform-origin: right center; }
        .page.right { border-radius: 2px 8px 8px 2px; transform: skewY(-2deg); transform-origin: left center; }
        .page::before { position: absolute; inset: 12px; border: 1px solid #c3b8a3; content: ""; }
        .page::after { position: absolute; left: 18px; right: 18px; top: 34%; height: 2px; background: #c7bca7; box-shadow: 0 13px #c7bca7, 0 26px #c7bca7, 0 39px #c7bca7; content: ""; opacity: .7; }
        .spine { position: absolute; z-index: 2; left: 50%; top: 4%; bottom: 4%; width: 3px; background: #8d816d; transform: translateX(-50%); }
        .progress-fill { position: absolute; z-index: 1; left: 0; bottom: 0; height: 8px; background: #8b7351; }
        .progress-label { position: absolute; z-index: 3; left: 50%; bottom: -27px; transform: translateX(-50%); color: var(--muted); font: 12px system-ui, sans-serif; }
        .state-0 .open-book { display: none; }
        .state-20 .closed-cover, .state-50 .closed-cover, .state-80 .closed-cover, .state-100 .closed-cover { display: none; }
        .state-20 .open-book { inset: 24% 12% 13%; }
        .state-20 .page.left { flex: .42; }
        .state-20 .page.right { flex: 1; }
        .state-50 .open-book { inset: 18% 5% 9%; }
        .state-80 .open-book, .state-100 .open-book { inset: 14% 0 7%; }
        .state-100 .page { background: #f7f1e3; }
        @media (max-width: 900px) { body { padding: 28px 18px; } .states { grid-template-columns: repeat(2, minmax(150px, 1fr)); } }
    </style>
</head>
<body>
    <header><h1>本の開き具合テスト</h1><p>閉じた本から、読み終えた本まで。正式な書架にはまだ反映していません。</p></header>
    <main class="states">
        <section class="state state-0"><div class="book"><div class="closed-cover"><span>青空文庫</span><span class="closed-title">山月記</span><span>中島敦</span></div></div><h2 class="state-name">未読 — 0%</h2><p class="state-note">本を閉じた状態</p></section>
        <section class="state state-20"><div class="book"><div class="open-book"><div class="page left"></div><div class="page right"><span class="progress-fill" style="width:20%"></span></div><i class="spine"></i><span class="progress-label">20%</span></div></div><h2 class="state-name">読書中 — 20%</h2><p class="state-note">少しだけ開いた状態</p></section>
        <section class="state state-50"><div class="book"><div class="open-book"><div class="page left"></div><div class="page right"><span class="progress-fill" style="width:50%"></span></div><i class="spine"></i><span class="progress-label">50%</span></div></div><h2 class="state-name">読書中 — 50%</h2><p class="state-note">本が半分開いた状態</p></section>
        <section class="state state-80"><div class="book"><div class="open-book"><div class="page left"></div><div class="page right"><span class="progress-fill" style="width:80%"></span></div><i class="spine"></i><span class="progress-label">80%</span></div></div><h2 class="state-name">終盤 — 80%</h2><p class="state-note">ほぼ開ききった状態</p></section>
        <section class="state state-100"><div class="book"><div class="open-book"><div class="page left"></div><div class="page right"><span class="progress-fill" style="width:100%"></span></div><i class="spine"></i><span class="progress-label">読了</span></div></div><h2 class="state-name">読了 — 100%</h2><p class="state-note">最後まで開いた状態</p></section>
    </main>
</body>
</html>
