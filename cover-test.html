<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本の開き具合 — 試作</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:48px 28px;background:#f4ead2;color:#332d24;font-family:system-ui,sans-serif}
header,main{max-width:1440px;margin:auto}h1{margin:0 0 12px;font-size:32px}header p,.note{color:#827760;line-height:1.8}
.states{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px;margin-top:48px}svg{display:block;width:100%;height:auto}h2{font-size:18px;margin:18px 0 8px}.note{font-size:14px;margin:0}
@media(max-width:850px){.states{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<header><h1>本の開き具合テスト</h1><p>表紙から本文へ、本文から裏表紙へ。<br>同じ大きさの本で、5つの状態を比較します。</p></header>
<main class="states" id="states"></main>
<script>
const cover=(back=false)=>`
<rect width="200" height="300" fill="#d9dde3" stroke="#89929c" stroke-width="1.4"/>
<rect x="9" y="9" width="182" height="282" fill="none" stroke="#9ba2aa"/>
<path d="M${back?195:5} 0v300" stroke="#89929c" stroke-width="2"/>
${back?'<text x="100" y="273" text-anchor="middle" font-size="12">青空文庫</text><path d="M86 245h28" stroke="#89929c"/>':'<text x="18" y="35" font-size="14">青空文庫</text><text x="100" y="158" text-anchor="middle" font-size="25" font-weight="700">山月記</text><text x="181" y="274" text-anchor="end" font-size="14">中島敦</text>'}`;
const page=()=>`<rect width="200" height="300" fill="#f6f0e3" stroke="#aaa18f"/>
${Array.from({length:8},(_,i)=>'<path d="M30 '+(62+i*22)+'h'+(i===7?88:140)+'" stroke="#c1b7a4" stroke-width="1.6"/>').join('')}`;
function panel(content,x,width,leftY,rightY,height){
return '<g transform="matrix('+width/200+' '+(rightY-leftY)/200+' 0 '+height/300+' '+x+' '+leftY+')">'+content+'</g>';
}
function book(p){
 let art='<g>';
 if(p===0||p===100){
  art+='<path d="M24 20H236V320H24Z" fill="#c9c2b2"/><path d="M22 17H233V317H22Z" fill="#ede6d7" stroke="#b8af9e"/>'+panel(cover(p===100),20,210,14,14,300);
 } else {
  const reverse=p>50;
  const hinge=reverse?158:92;
  art+='<path d="M24 20L'+(hinge+4)+' 38L234 20V306L'+(hinge+4)+' 322L24 306Z" fill="#c9c2b2"/>';
  art+=panel(p===25?cover():page(),20,hinge-20,14,32,282);
  art+=panel(p===75?cover(true):page(),hinge,230-hinge,32,14,282);
  art+='<path d="M'+hinge+' 32v282" stroke="#8b8271" stroke-width="2"/>';
 }
 art+='</g>';
 return '<svg viewBox="0 0 250 335" role="img" aria-label="読書の進み具合 '+p+'%" fill="#303944">'+art+'</svg>';
}
const states=[[0,'未読','表紙を閉じた状態。'],[25,'読書中','表紙を開き、本文が大きく見える。'],[50,'中ほど','左右のページが見える折り返し地点。'],[75,'終盤','反対側から見た本。裏表紙を閉じていく。'],[100,'読了','裏表紙を閉じた状態。背は右側に。']];
document.getElementById('states').innerHTML=states.map(([p,name,note])=>'<section>'+book(p)+'<h2>'+name+' — '+p+'%</h2><p class="note">'+note+'</p></section>').join('');
</script>
</html>
