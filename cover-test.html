<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yomu cover state test</title>
    <style>
        :root { color-scheme: light; --bg: #f4ead2; --ink: #332d24; --muted: #9a8d74; --line: #b9ad96; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 48px; background: var(--bg); color: var(--ink); font-family: Georgia, "Noto Serif JP", serif; }
        header { max-width: 1180px; margin: 0 auto 38px; }
        h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: .08em; }
        p { margin: 0; color: var(--muted); font-family: system-ui, sans-serif; }
        .states { max-width: 1420px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 34px 30px; align-items: start; }
        .state { min-width: 0; }
        .state-name { margin: 14px 0 5px; font-size: 17px; font-weight: 600; }
        .state-note { font-size: 12px; line-height: 1.6; }
        .book { position: relative; aspect-ratio: .72 / 1; min-height: 280px; }
        .book-pages { position: absolute; inset: 8% 4% 7%; overflow: hidden; background: #eee7d7; border: 1px solid #9f927a; box-shadow: 4px 5px 0 rgba(70, 60, 45, .18); }
        .book-back { position: absolute; z-index: 2; inset: 8% 10%; padding: 18px; background: #d9dde3; border: 1px solid #78818b; box-shadow: 5px 5px 0 #c2c5c9; opacity: 0; transform-origin: right center; transition: opacity .2s ease, transform .2s ease; }
        .book-back::after { position: absolute; inset: 9px; border: 1px solid #9ba2aa; content: ""; }
        .book-pages::before { position: absolute; inset: 10px; border: 1px solid #c3b8a3; content: ""; }
        .book-pages::after { position: absolute; left: 18px; right: 18px; top: 36%; height: 2px; background: #c7bca7; box-shadow: 0 13px #c7bca7, 0 26px #c7bca7, 0 39px #c7bca7; content: ""; opacity: .7; }
        .book-front { position: absolute; z-index: 3; inset: 8% 10%; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; background: #d9dde3; border: 1px solid #78818b; box-shadow: 5px 5px 0 #c2c5c9; transform-origin: left center; transform: perspective(500px) rotateY(calc(var(--front-angle) * 1deg)) translateX(calc(var(--front-shift) * 1%)); opacity: var(--front-opacity); }
        .book-front::after { position: absolute; inset: 9px; border: 1px solid #9ba2aa; content: ""; }
        .book-front span { position: relative; z-index: 1; }
        .closed-title { align-self: center; margin: auto 0; font-size: 25px; font-weight: 700; }
        .book-spine { position: absolute; z-index: 4; left: 10%; top: 8%; bottom: 7%; width: 3px; background: #78818b; }
        .book-front span { opacity: var(--front-text-opacity); }
        .book-back { opacity: var(--back-opacity); transform: perspective(500px) rotateY(calc(var(--back-angle) * 1deg)) translateX(calc(var(--back-shift) * 1%)); }
        @media (max-width: 900px) { body { padding: 28px 18px; } .states { grid-template-columns: repeat(2, minmax(150px, 1fr)); } }
    </style>
</head>
<body>
    <header><h1>本の開き具合テスト</h1><p>閉じた本から、読み終えた本まで。正式な書架にはまだ反映していません。</p></header>
    <main class="states" id="states"></main>
    <script>
      const states = document.getElementById('states');
      const card = (percent) => {
        const firstHalf = percent <= 50;
        const half = firstHalf ? percent / 50 : (percent - 50) / 50;
        const frontAngle = firstHalf ? -32 * half : -32 - 56 * half;
        const frontShift = firstHalf ? -8 * half : -8 - 17 * half;
        const frontOpacity = firstHalf ? 1 : 1 - half;
        const backOpacity = firstHalf ? 0 : Math.max(0, (percent - 55) / 45);
        const backAngle = firstHalf ? 26 : 26 * (1 - half);
        const backShift = firstHalf ? 8 : 8 * (1 - half);
        const textOpacity = firstHalf ? 1 : Math.max(.05, 1 - half * 1.2);
        const note = percent === 0 ? '本を閉じた状態' : percent === 100 ? '封底が右側に現れた状態' : percent <= 50 ? '表紙が少しずつ開く状態' : '本が左右反転し、封底が見え始める状態';
        return `<section class="state" style="--front-angle:${frontAngle};--front-shift:${frontShift};--front-opacity:${frontOpacity};--back-opacity:${backOpacity};--back-angle:${backAngle};--back-shift:${backShift};--front-text-opacity:${textOpacity}"><div class="book"><div class="book-pages"></div><div class="book-back"></div><div class="book-front"><span>青空文庫</span><span class="closed-title">山月記</span><span>中島敦</span></div><i class="book-spine"></i></div><h2 class="state-name">${percent === 0 ? '未読' : percent === 100 ? '読了' : '読書中'} — ${percent}%</h2><p class="state-note">${note}</p></section>`;
      };
      states.innerHTML = Array.from({length: 21}, (_, i) => card(i * 5)).join('');
    </script>
</body>
</html>
