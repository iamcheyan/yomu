<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Yomu - 日語読書器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/app_icon.svg">
    <link rel="apple-touch-icon" href="assets/app_icon.svg">
    <link rel="stylesheet" href="css/style.css?v=5">
    <link rel="stylesheet" href="css/animations.css" id="animation-style">
</head>

<body>

    <!-- Loading -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loading-msg">辞書を読み込み中...</div>
    </div>

    <!-- ===== 书籍列表 ===== -->
    <div id="book-list-view" class="book-list-view">
        <div class="book-list-header">
            <h1>読書器</h1>
            <div class="header-actions">
                <button id="btn-show-store" onclick="Yomu.showStore()">書庫</button>
            </div>
        </div>
        <div class="home-filter-panel" id="home-filter-panel">
            <div class="home-filter-main">
                <div class="filter-chips-group">
                    <button class="filter-chip active" data-home-filter-type="category" data-home-filter-value=""
                        onclick="Yomu.setHomeFilter('category', '')">すべて</button>
                    <button class="filter-chip" data-home-filter-type="category" data-home-filter-value="fiction"
                        onclick="Yomu.setHomeFilter('category', 'fiction')">小説</button>
                    <button class="filter-chip" data-home-filter-type="category" data-home-filter-value="children"
                        onclick="Yomu.setHomeFilter('category', 'children')">児童文学</button>
                    <button class="filter-chip" data-home-filter-type="category" data-home-filter-value="essay"
                        onclick="Yomu.setHomeFilter('category', 'essay')">随筆・記録</button>
                    <button class="filter-chip" data-home-filter-type="category" data-home-filter-value="poetry"
                        onclick="Yomu.setHomeFilter('category', 'poetry')">詩歌</button>
                    <button class="filter-chip" data-home-filter-type="category" data-home-filter-value="drama"
                        onclick="Yomu.setHomeFilter('category', 'drama')">戯曲</button>
                    <button class="filter-chip" data-home-filter-type="category" data-home-filter-value="foreign"
                        onclick="Yomu.setHomeFilter('category', 'foreign')">海外文学</button>
                </div>
                <select class="settings-select filter-select" id="home-translation-select"
                    onchange="Yomu.setHomeFilter('translation', this.value)">
                    <option value="">翻訳: すべて</option>
                    <option value="translated">翻訳あり</option>
                    <option value="untranslated">原文のみ</option>
                </select>
            </div>
            <div class="filter-summary" id="home-filter-summary"></div>
        </div>
        <div id="book-grid" class="book-grid"></div>

        <div class="pagination-bar u-margin-bottom-20" id="home-pagination">
            <button onclick="Yomu.prevHomePage()" id="btn-home-prev" class="page-btn">前へ</button>
            <button onclick="Yomu.nextHomePage()" id="btn-home-next" class="page-btn">次へ</button>
        </div>
    </div>

    <!-- ===== 书库 (Store) ===== -->
    <div id="store-view" class="store-view hidden">
        <div class="store-header">
            <div>
                <h1 onclick="Yomu.showBookList()" class="u-cursor-pointer">書庫</h1>
                <p>所蔵作品から検索して読む</p>
            </div>
            <div class="header-actions">
                <button onclick="Yomu.showBookList()" class="back-btn">戻る</button>
            </div>
        </div>
        <div class="store-search">
            <input type="text" id="store-search-input" placeholder="作品名、著者名で検索..."
                oninput="Yomu.filterStore(this.value)">
        </div>
        <div class="store-filter-panel" id="store-filter-panel">
            <div class="filter-group" id="filter-authors"></div>
            <div class="filter-group">
                <div class="filter-label">分類</div>
                <button class="filter-chip active" data-filter-type="category" data-filter-value=""
                    onclick="Yomu.setStoreFilter('category', '')">すべて</button>
                <button class="filter-chip" data-filter-type="category" data-filter-value="fiction"
                    onclick="Yomu.setStoreFilter('category', 'fiction')">小説</button>
                <button class="filter-chip" data-filter-type="category" data-filter-value="children"
                    onclick="Yomu.setStoreFilter('category', 'children')">児童文学</button>
                <button class="filter-chip" data-filter-type="category" data-filter-value="essay"
                    onclick="Yomu.setStoreFilter('category', 'essay')">随筆・記録</button>
                <button class="filter-chip" data-filter-type="category" data-filter-value="poetry"
                    onclick="Yomu.setStoreFilter('category', 'poetry')">詩歌</button>
                <button class="filter-chip" data-filter-type="category" data-filter-value="drama"
                    onclick="Yomu.setStoreFilter('category', 'drama')">戯曲</button>
                <button class="filter-chip" data-filter-type="category" data-filter-value="foreign"
                    onclick="Yomu.setStoreFilter('category', 'foreign')">海外文学</button>
            </div>
            <div class="filter-group">
                <div class="filter-label">文字遣い</div>
                <button class="filter-chip active" data-filter-type="orthography" data-filter-value=""
                    onclick="Yomu.setStoreFilter('orthography', '')">すべて</button>
                <button class="filter-chip" data-filter-type="orthography" data-filter-value="新字新仮名"
                    onclick="Yomu.setStoreFilter('orthography', '新字新仮名')">新字新仮名</button>
                <button class="filter-chip" data-filter-type="orthography" data-filter-value="新字旧仮名"
                    onclick="Yomu.setStoreFilter('orthography', '新字旧仮名')">新字旧仮名</button>
                <button class="filter-chip" data-filter-type="orthography" data-filter-value="旧字旧仮名"
                    onclick="Yomu.setStoreFilter('orthography', '旧字旧仮名')">旧字旧仮名</button>
            </div>
            <div class="filter-summary" id="store-filter-summary"></div>
        </div>
        <div id="store-grid" class="book-grid"></div>

        <div class="pagination-bar">
            <button onclick="Yomu.prevStorePage()" id="btn-prev-page" class="page-btn">前へ</button>
            <button onclick="Yomu.nextStorePage()" id="btn-next-page" class="page-btn">次へ</button>
        </div>
    </div>

    <!-- ===== 阅读器 ===== -->
    <div id="reader-view" class="reader-view">
        <div class="reader-header">
            <div>
                <h1 id="reader-title" onclick="Yomu.showBookList()" class="u-cursor-pointer"></h1>
                <div class="author" id="reader-author"></div>
            </div>
        </div>
        <div id="book-frontmatter" class="book-frontmatter"></div>
        <div id="novel-content" class="novel-text font-mincho"></div>

        <button id="reader-back-btn" class="reader-back-btn" onclick="Yomu.showBookList()" title="戻る" aria-label="戻る">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>

        <!-- Minimalist Status Bar -->
        <div id="reader-status-bar" class="reader-status-bar">
            <div class="status-left u-cursor-pointer" onclick="Yomu.toggleBookInfoCard(event)">
                <span id="status-title"></span> · <span id="status-author"></span>
            </div>
            <div class="status-right">
                <span id="status-progress">0%</span>
                <button class="status-settings-btn" onclick="Yomu.toggleSettingsFromButton(event)" title="設定"
                    aria-label="設定">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M12 0c-1.3 0-2.3.9-2.7 2.1-.8.2-1.6.5-2.3 1-1.1-.7-2.6-.4-3.5.5-.9.9-1.2 2.4-.5 3.5-.5.7-.8 1.5-1 2.3-1.2.4-2.1 1.4-2.1 2.7s.9 2.3 2.1 2.7c.2.8.5 1.6 1 2.3-.7 1.1-.4 2.6.5 3.5.9.9 2.4 1.2 3.5.5.7.5 1.5.8 2.3 1 0.4 1.2 1.4 2.1 2.7 2.1s2.3-.9 2.7-2.1c.8-.2 1.6-.5 2.3-1 1.1.7 2.6.4 3.5-.5.9-.9 1.2-2.4.5-3.5.5-.7.8-1.5 1-2.3 1.2-.4 2.1-1.4 2.1-2.7s-.9-2.3-2.1-2.7c-.2-.8-.5-1.6-1-2.3.7-1.1.4-2.6-.5-3.5-.9-.9-2.4-1.2-3.5-.5-.7-.5-1.5-.8-2.3-1-.4-1.2-1.4-2.1-2.7-2.1zm0 7.5c2.5 0 4.5 2 4.5 4.5s-2 4.5-4.5 4.5-4.5-2-4.5-4.5 2-4.5 4.5-4.5z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Book Info Card (Floating) -->
        <div id="book-info-card" class="book-info-card">
            <div class="card-label">Reading</div>
            <div id="card-title" class="card-title"></div>
            <div id="card-author" class="card-author"></div>

            <!-- Detailed Metadata Grid -->
            <div id="card-metadata" class="frontmatter-grid card-metadata"></div>

            <!-- Card Footer (Links) -->
            <div id="card-footer" class="card-footer"></div>
        </div>
    </div>

    <div id="settings-overlay" class="settings-overlay"></div>
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h2>メニュー</h2>
            <div class="u-display-flex u-gap-10">
                <button class="close-btn" onclick="Yomu.toggleSettingsFromButton(event)">×</button>
            </div>
        </div>

        <div class="settings-group">
            <label>フォント</label>
            <div class="font-btn-group">
                <button class="font-btn active" data-font="mincho" onclick="Yomu.setFont('mincho')">明朝体</button>
                <button class="font-btn" data-font="gothic" onclick="Yomu.setFont('gothic')">ゴシック</button>
            </div>
        </div>

        <div class="settings-group">
            <label>文字サイズ</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustFontSize(-1)">-</button>
                <input type="range" id="font-size-slider" min="14" max="32" value="20"
                    oninput="Yomu.setFontSize(this.value)">
                <button class="step-btn" onclick="Yomu.adjustFontSize(1)">+</button>
                <span class="value-display u-display-none" id="font-size-value">20px</span>
            </div>
        </div>

        <div class="settings-group">
            <label>行間</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustLineHeight(-1)">-</button>
                <input type="range" id="line-height-slider" min="15" max="35" value="22"
                    oninput="Yomu.setLineHeight(this.value)">
                <button class="step-btn" onclick="Yomu.adjustLineHeight(1)">+</button>
                <span class="value-display u-display-none" id="line-height-value">2.2</span>
            </div>
        </div>

        <div class="settings-group">
            <label>ふりがな表示</label>
            <select id="furigana-mode-select" class="settings-select" onchange="Yomu.setFuriganaMode(this.value)">
                <option value="none">不表示</option>
                <option value="internal">内置</option>
                <option value="nlp">Kuromoji.js</option>
            </select>
        </div>

        <div class="settings-group">
            <label>初期化</label>
            <div class="u-text-align-right">
                <button class="font-btn" onclick="Yomu.clearAllData()">全て削除</button>
            </div>
        </div>

        <div class="settings-group">
            <label>バージョン</label>
            <span id="settings-version" class="version-tag">v1.0.0</span>
        </div>
    </div>

    <!-- Reusable Custom Modal (OpenJLPT style) -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title">通知</h2>
            <p id="modal-message">内容</p>
            <div class="modal-footer" id="modal-footer">
                <button class="modal-btn" id="modal-cancel-btn">キャンセル</button>
                <button class="modal-btn primary" id="modal-ok-btn">確定</button>
            </div>
        </div>
    </div>

    <!-- Global Footer (Unified) -->
    <div class="library-footer global-footer">
        <p><span id="library-count">0</span> 冊の蔵書</p>
        <a class="github-footer-link" href="https://github.com/iamcheyan/yomu" target="_blank"
            rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M12 0.5C5.65 0.5 0.5 5.65 0.5 12c0 5.08 3.29 9.38 7.86 10.9.58.1.79-.25.79-.56v-2.02c-3.2.7-3.88-1.38-3.88-1.38-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18.92-.26 1.9-.38 2.88-.39.98 0 1.96.13 2.88.39 2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.75.11 3.04.74.81 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.27 5.68.42.36.79 1.07.79 2.16v3.02c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35 0.5 12 0.5Z">
                </path>
            </svg>
            <span>GitHub</span>
        </a>
    </div>

    <!-- JS Modules -->
    <script src="libs/kuromoji.js"></script>
    <script src="js/storage.js?v=3"></script>
    <script src="js/tokenizer.js?v=3"></script>
    <script src="js/reader.js?v=6"></script>
    <script src="js/aozora.js?v=4"></script>
    <script src="js/app.js?v=9"></script>
</body>

</html>
