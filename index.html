<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F7F3EA">
    <title>Yomu - 日語読書器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/app_icon.svg">
    <link rel="apple-touch-icon" href="assets/app_icon.png">
    <link rel="stylesheet" href="css/style.css?v=35">
    <link rel="stylesheet" href="css/book-cover.css?v=8">

    <script>
        // PWA: register service worker for offline reading (http/https only;
        // Android WebView file:// builds skip this gracefully).
        if ('serviceWorker' in navigator &&
            (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err =>
                    console.warn('SW registration skipped:', err.message));
            });
        }
    </script>

</head>

<body>

    <!-- Loading -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-mark">読</div>
        <div class="loading-text" id="loading-msg">辞書を読み込み中...</div>
    </div>

    <!-- ===== 単一メイン書架画面 ===== -->
    <div id="book-list-view" class="home-view">

        <section class="home-hero">
            <p class="home-eyebrow">Yomu · 青空文庫</p>
            <div class="home-hero-header">
                <h2 class="home-title" id="home-title" onclick="Yomu.setLibraryScope('library')" style="cursor:pointer;" title="本棚のトップへ">書架</h2>
                <div class="header-actions">
                    <button id="btn-import-file" class="icon-btn" onclick="Yomu.pickLocalFile()" title="ファイルから追加 (.txt / .epub)" aria-label="ファイルから追加">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </button>
                    <button id="btn-open-settings" class="icon-btn" onclick="Yomu.toggleSettings()" title="設定" aria-label="設定">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="home-sub" id="home-sub">静かに読むための日本語書架。全ての本が手元に。</p>

            <div class="home-toolbar-bar">
                <div class="library-scope-nav" role="tablist" aria-label="表示範囲">
                    <button type="button" class="scope-nav-btn active" data-library-scope="library" onclick="Yomu.setLibraryScope('library')">
                        <span class="scope-nav-label">本棚</span>
                        <span class="scope-nav-badge" id="library-count">20</span>
                    </button>
                    <button type="button" class="scope-nav-btn" data-library-scope="catalog" onclick="Yomu.setLibraryScope('catalog')">
                        <span class="scope-nav-label">全作品</span>
                        <span class="scope-nav-badge" id="catalog-count">15,035</span>
                    </button>
                </div>

                <div class="home-search-wrap" id="home-search-wrap">
                    <button type="button" class="search-trigger-btn" id="search-trigger-btn" onclick="Yomu.toggleHomeSearch(true)" title="検索を開く" aria-label="検索">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <span class="search-trigger-text">検索</span>
                    </button>

                    <div class="search-inline-capsule hidden" id="search-inline-capsule">
                        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="home-search-input" placeholder="本棚内を検索..." autocomplete="off">
                        <button id="home-search-clear" class="search-clear-btn hidden" onclick="Yomu.clearHomeFilters()" title="検索クリア" aria-label="検索クリア">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                        <button type="button" class="search-close-btn" onclick="Yomu.toggleHomeSearch(false)" title="閉じる" aria-label="閉じる">
                            閉じる
                        </button>
                    </div>
                </div>
            </div>
            <input type="file" id="local-file-input" accept=".txt,.text,.epub" class="hidden" onchange="Yomu.onLocalFilePicked(this)">
        </section>

        <div class="home-chips">
            <div class="filter-chips-group" id="home-filter-chips"></div>
            <!-- 全作品时，这里直接显示作者 / 分类 / 文字遣い筛选；本棚时隐藏。 -->
            <div id="catalog-filter-tools" class="catalog-filter-tools hidden">
                <div class="catalog-filter-groups">
                    <div id="filter-categories" class="filter-group"></div>
                    <div id="filter-authors" class="filter-group"></div>
                    <div id="filter-orthographies" class="filter-group"></div>
                    <div id="filter-translation" class="filter-group"></div>
                    <div id="filter-download" class="filter-group"></div>
                </div>
            </div>
            <p class="filter-summary" id="home-filter-summary"></p>
            <p class="filter-summary" id="home-fulltext-status" aria-live="polite"></p>
        </div>

        <div id="book-grid" class="book-listing"></div>

        <div id="catalog-pagination" class="pagination-bar hidden">
            <button onclick="Yomu.prevCatalogPage()" id="btn-prev-catalog-page" class="page-btn">前へ</button>
            <span class="page-info" id="catalog-page-info">1 / 1</span>
            <button onclick="Yomu.nextCatalogPage()" id="btn-next-catalog-page" class="page-btn">次へ</button>
        </div>
    </div>

    <!-- ===== 阅读器（一页连续纵向内容） ===== -->
    <div id="reader-view" class="reader-view">
        <div id="reader-progress-bar" aria-hidden="true"><div id="reader-progress-fill"></div></div>

        <div class="reader-page">
            <header class="reader-masthead">
                <h1 id="reader-title"></h1>
                <p class="reader-author-line" id="reader-author"></p>
            </header>
            <div id="book-frontmatter" class="book-frontmatter"></div>
            <div class="reader-flow-start" aria-hidden="true"></div>
            <div id="novel-content" class="novel-text font-mincho"></div>
        </div>

        <!-- 顶部轻量浮层：返回 / 书名 / 操作 -->
        <div id="reader-topbar" class="reader-topbar">
            <button type="button" id="reader-back-btn" class="bar-icon-btn" onclick="Yomu.back()" title="戻る" aria-label="戻る">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </button>
            <div class="bar-title u-cursor-pointer" onclick="Yomu.toggleBookInfoCard(event)">
                <span id="status-title"></span>
            </div>
            <div class="bar-actions">
                <button type="button" id="toc-btn" class="bar-icon-btn" onclick="Yomu.toggleToc(event)" title="目次" aria-label="目次">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="4" y1="6" x2="20" y2="6"></line>
                        <line x1="4" y1="12" x2="20" y2="12"></line>
                        <line x1="4" y1="18" x2="14" y2="18"></line>
                    </svg>
                </button>
                <button type="button" id="wordbook-btn" class="bar-icon-btn" onclick="YomuWordbook.toggle()" title="単語帳" aria-label="単語帳">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2l2.4 6.3 6.6.4-5.1 4.3 1.7 6.4L12 15.9l-5.6 3.5 1.7-6.4L3 8.7l6.6-.4z"></path>
                    </svg>
                </button>
                <button type="button" id="autoscroll-btn" class="bar-icon-btn" onclick="Yomu.toggleAutoScroll()" title="自動スクロール" aria-label="自動スクロール">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="6 3 13 12 6 21 6 3" fill="currentColor" stroke="none"></polygon>
                        <line x1="16" y1="4" x2="16" y2="20"></line>
                    </svg>
                </button>
                <button type="button" id="immersive-toggle-btn" class="bar-icon-btn" onclick="Yomu.toggleImmersive(event)" title="没入モード" aria-label="没入モード">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </button>
                <button type="button" class="bar-icon-btn status-settings-btn" onclick="Yomu.toggleSettingsFromButton(event)" title="設定"
                    aria-label="設定">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 底部：轻量进度文字 -->
        <div id="reader-status-bar" class="reader-bottombar">
            <span id="status-progress">0%</span>
        </div>

        <button id="back-to-top-btn" onclick="Yomu.scrollToTop()" title="先頭へ戻る" aria-label="先頭へ戻る">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </button>

        <!-- Table of Contents -->
        <div id="toc-overlay" class="toc-overlay" onclick="Yomu.closeToc()"></div>
        <div id="toc-panel" class="toc-panel" role="dialog" aria-label="目次">
            <div class="toc-header">
                <h2>目次</h2>
                <button class="close-btn" onclick="Yomu.closeToc()" aria-label="閉じる">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="toc-bookmarks" class="toc-bookmarks"></div>
            <div id="toc-list" class="toc-list"></div>
        </div>

        <!-- Book Info Card (Floating) -->
        <div id="book-info-card" class="book-info-card">
            <div class="card-label">Reading</div>
            <div id="card-title" class="card-title"></div>
            <div id="card-author" class="card-author"></div>
            <div id="card-metadata" class="frontmatter-grid card-metadata"></div>
            <div id="card-footer" class="card-footer"></div>
        </div>
    </div>

    <!-- B1: Wordbook panel -->
    <div id="wordbook-overlay" class="toc-overlay" onclick="YomuWordbook.close()"></div>
    <div id="wordbook-panel" class="toc-panel wordbook-panel" role="dialog" aria-label="単語帳">
        <div class="toc-header">
            <h2>単語帳</h2>
            <button class="close-btn" onclick="YomuWordbook.close()" aria-label="閉じる">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div id="wordbook-count" class="wordbook-count"></div>
        <div id="wordbook-list" class="wordbook-list"></div>
        <div class="wordbook-footer">
            <button class="wordbook-action-btn" onclick="YomuWordbook.exportJSON()">エクスポート</button>
            <button class="wordbook-action-btn" onclick="document.getElementById('wordbook-import-file').click()">インポート</button>
            <input type="file" id="wordbook-import-file" accept="application/json,.json" class="hidden" onchange="YomuWordbookImport(this)">
        </div>
    </div>

    <div id="settings-overlay" class="settings-overlay"></div>
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h2>読書設定</h2>
            <button class="close-btn" onclick="Yomu.toggleSettingsFromButton(event)" aria-label="閉じる">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <nav class="settings-tabs" aria-label="設定分類">
            <button type="button" class="settings-tab active" data-settings-section="reading" onclick="Yomu.setSettingsSection('reading')">読書</button>
            <button type="button" class="settings-tab" data-settings-section="display" onclick="Yomu.setSettingsSection('display')">表示</button>
            <button type="button" class="settings-tab" data-settings-section="data" onclick="Yomu.setSettingsSection('data')">データ</button>
        </nav>

        <div class="settings-group settings-group-column font-pair-group" data-settings-section="display">
            <label>フォント</label>
            <div class="font-preset-btn-group" role="group" aria-label="プリセット">
                <button class="font-btn font-preset-btn" data-preset="mincho" onclick="Yomu.applyFontPreset('mincho')">明朝経典</button>
                <button class="font-btn font-preset-btn" data-preset="textbook" onclick="Yomu.applyFontPreset('textbook')">教科書体</button>
                <button class="font-btn font-preset-btn" data-preset="maru" onclick="Yomu.applyFontPreset('maru')">丸ゴシック</button>
            </div>
            <div class="font-pair-row">
                <label class="font-pair-label">本文</label>
                <div class="font-pair-control">
                    <div id="font-body-select" class="ypop-host font-pair-select-host"></div>
                    <div class="font-sample" id="font-sample-body">吾輩は猫である。名前はまだ無い。</div>
                </div>
            </div>
            <div class="font-pair-row">
                <label class="font-pair-label">振りがな</label>
                <div class="font-pair-control">
                    <div id="font-ruby-select" class="ypop-host font-pair-select-host"></div>
                    <div class="font-sample" id="font-sample-ruby">ふりがな・ルビ（わがはい・ねこ）</div>
                </div>
            </div>
            <div id="font-combo-preview" class="font-combo-preview"><ruby>吾輩<rt>わがはい</rt></ruby>は<ruby>猫<rt>ねこ</rt></ruby>である。名前はまだ無い。</div>
        </div>

        <div class="settings-group" data-settings-section="display">
            <label>文字サイズ</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustFontSize(-1)" aria-label="小さく">−</button>
                <input type="range" id="font-size-slider" min="14" max="32" value="21"
                    oninput="Yomu.setFontSize(this.value)">
                <button class="step-btn" onclick="Yomu.adjustFontSize(1)" aria-label="大きく">＋</button>
                <span class="value-display" id="font-size-value">21px</span>
            </div>
        </div>

        <div class="settings-group" data-settings-section="display">
            <label>行間</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustLineHeight(-1)" aria-label="狭く">−</button>
                <input type="range" id="line-height-slider" min="16" max="30" value="21"
                    oninput="Yomu.setLineHeight(this.value)">
                <button class="step-btn" onclick="Yomu.adjustLineHeight(1)" aria-label="広く">＋</button>
                <span class="value-display" id="line-height-value">2.1</span>
            </div>
        </div>

        <div class="settings-group" data-settings-section="display">
            <label>左右留白</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustMargin(-2)" aria-label="狭く">−</button>
                <input type="range" id="margin-slider" min="12" max="48" step="2" value="24"
                    oninput="Yomu.setMargin(this.value)">
                <button class="step-btn" onclick="Yomu.adjustMargin(2)" aria-label="広く">＋</button>
                <span class="value-display" id="margin-value">24px</span>
            </div>
        </div>

        <div class="settings-group settings-group-column" data-settings-section="display">
            <label>本文幅</label>
            <div class="font-preset-btn-group reader-width-group" role="group" aria-label="本文幅">
                <button class="font-btn reader-width-btn" data-reader-width="60" onclick="Yomu.setReaderWidth(60)">60%</button>
                <button class="font-btn reader-width-btn active" data-reader-width="75" onclick="Yomu.setReaderWidth(75)">75%</button>
                <button class="font-btn reader-width-btn" data-reader-width="90" onclick="Yomu.setReaderWidth(90)">90%</button>
                <button class="font-btn reader-width-btn" data-reader-width="100" onclick="Yomu.setReaderWidth(100)">全幅</button>
            </div>
        </div>

        <div class="settings-group settings-group-column" data-settings-section="display">
            <label>背景色</label>
            <div class="theme-btn-group" role="group" aria-label="背景色">
                <button class="theme-btn theme-light active" data-theme="light" onclick="Yomu.setTheme('light')" aria-label="白"><span></span>白</button>
                <button class="theme-btn theme-sepia" data-theme="sepia" onclick="Yomu.setTheme('sepia')" aria-label="セピア"><span></span>セピア</button>
                <button class="theme-btn theme-green" data-theme="green" onclick="Yomu.setTheme('green')" aria-label="緑"><span></span>緑</button>
                <button class="theme-btn theme-dark" data-theme="dark" onclick="Yomu.setTheme('dark')" aria-label="黒"><span></span>黒</button>
            </div>
        </div>

        <div class="settings-group" data-settings-section="display">
            <label>明るさ</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustBrightness(-10)" aria-label="暗く">−</button>
                <input type="range" id="brightness-slider" min="50" max="100" step="5" value="100"
                    oninput="Yomu.setBrightness(this.value)">
                <button class="step-btn" onclick="Yomu.adjustBrightness(10)" aria-label="明るく">＋</button>
            </div>
        </div>

        <div class="settings-group" data-settings-section="reading">
            <label>ふりがな表示</label>
            <div id="furigana-mode-select" class="ypop-host"></div>
        </div>

        <div class="settings-group settings-group-column" data-settings-section="reading">
            <label>読書操作</label>
            <label class="switch-row">
                <span>電子ペーパー表示</span>
                <span class="switch"><input type="checkbox" id="eink-mode-toggle" onchange="Yomu.setEinkMode(this.checked)"><span class="slider-round"></span></span>
            </label>
            <label class="switch-row">
                <span>JLPT 難度表示（辞書ポップアップ）</span>
                <span class="switch"><input type="checkbox" id="jlpt-show-toggle" onchange="Yomu.setJlptShow(this.checked)"><span class="slider-round"></span></span>
            </label>
            <label class="switch-row">
                <span>自動スクロール速度</span>
                <div id="autoscroll-speed-select" class="ypop-host settings-select-inline-host"></div>
            </label>
        </div>

        <div class="settings-group settings-group-column" data-settings-section="data">
            <label>データバックアップ（読書データ一括）</label>
            <div class="backup-row">
                <button class="settings-btn" type="button" onclick="Yomu.exportBackup()">書き出し</button>
                <button class="settings-btn" type="button" onclick="document.getElementById('backup-file-input').click()">読み込み</button>
                <input type="file" id="backup-file-input" accept=".json,application/json" class="hidden" onchange="Yomu.importBackup(this)">
            </div>
        </div>

        <div class="settings-group settings-group-column" data-settings-section="data">
            <label>データ初期化</label>
            <div>
                <button class="font-btn" onclick="Yomu.clearAllData()">全て削除</button>
            </div>
        </div>

        <div class="settings-group" data-settings-section="data">
            <label>バージョン</label>
            <span id="settings-version" class="version-tag">v1.0.0</span>
        </div>
    </div>

    <!-- Reusable Custom Modal (OpenJLPT style) -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title">通知</h2>
            <p id="modal-message">内容</p>
            <div class="modal-footer" id="modal-footer">
                <button class="modal-btn" id="modal-cancel-btn">キャンセル</button>
                <button class="modal-btn primary" id="modal-ok-btn">確定</button>
            </div>
        </div>
    </div>

    <div class="library-footer global-footer">
        <p>青空文庫より <span id="library-footer-count">0</span> 冊を所蔵</p>
        <a class="github-footer-link" href="https://github.com/iamcheyan/yomu" target="_blank"

    <!-- Mobile UX: toast, long-press action sheet, brightness dim -->
    <div id="toast-container" aria-live="polite"></div>
    <div id="brightness-overlay" aria-hidden="true"></div>
    <div id="action-sheet-overlay" class="action-sheet-overlay" onclick="Yomu.closeActionSheet()"></div>
    <div id="action-sheet" class="action-sheet" role="dialog" aria-label="操作"></div>

    <script src="js/book-cover.js?v=2"></script>
    <script src="js/tokenizer.js?v=3"></script>

    <script src="js/aozora.js?v=5"></script>
    <script src="js/bookmarks.js?v=1"></script>
