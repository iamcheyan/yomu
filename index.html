<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Yomu - 日語読書器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/app_icon.svg">
    <link rel="apple-touch-icon" href="assets/app_icon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css" id="animation-style">
</head>

<body class="font-mincho show-furigana">

    <!-- Loading -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loading-msg">辞書を読み込み中...</div>
    </div>

    <!-- ===== 书籍列表 ===== -->
    <div id="book-list-view" class="book-list-view">
        <div class="book-list-header">
            <h1>読書器</h1>
            <div class="header-actions">
                <button id="btn-show-store" onclick="Yomu.showStore()">書庫</button>
            </div>
        </div>
        <div id="book-grid" class="book-grid"></div>
        
        <div class="pagination-bar" id="home-pagination" style="margin-bottom: 20px;">
            <button onclick="Yomu.prevHomePage()" id="btn-home-prev" class="page-btn">←</button>
            <button onclick="Yomu.nextHomePage()" id="btn-home-next" class="page-btn">→</button>
        </div>
        <div class="library-footer">
            <p>日本の古典文学を読む · <span id="library-count">0</span> 冊の蔵書</p>
        </div>
    </div>

    <!-- ===== 书库 (Store) ===== -->
    <div id="store-view" class="store-view hidden">
        <div class="store-header">
            <div>
                <h1>書庫</h1>
                <p>所蔵作品から検索して読む</p>
            </div>
            <div class="header-actions">
                <button onclick="Yomu.showBookList()" class="back-btn">← 戻る</button>
            </div>
        </div>
        <div class="store-search">
            <input type="text" id="store-search-input" placeholder="作品名、著者名で検索..."
                oninput="Yomu.filterStore(this.value)">
        </div>
        <div id="store-grid" class="book-grid"></div>
        
        <div class="pagination-bar">
            <button onclick="Yomu.prevStorePage()" id="btn-prev-page" class="page-btn">←</button>
            <button onclick="Yomu.nextStorePage()" id="btn-next-page" class="page-btn">→</button>
        </div>
    </div>

    <!-- ===== 阅读器 ===== -->
    <div id="reader-view" class="reader-view">
        <div class="reader-header">
            <div>
                <h1 id="reader-title"></h1>
                <div class="author" id="reader-author"></div>
            </div>
        </div>
        <div id="novel-content" class="novel-text"></div>
        
        <!-- Minimalist Status Bar -->
        <div id="reader-status-bar" class="reader-status-bar">
            <div class="status-left">
                <span id="status-title"></span> · <span id="status-author"></span>
            </div>
            <div class="status-right">
                <span id="status-progress">0%</span>
            </div>
        </div>
    </div>

    <!-- ===== 生词本 ===== -->
    <div id="vocab-view" class="vocab-view hidden">
        <div class="vocab-header">
            <h1>単語帳</h1>
            <div class="count" id="vocab-count">0 語</div>
        </div>
        <ul id="vocab-list" class="vocab-list"></ul>
        <div id="vocab-empty" class="vocab-empty">まだ単語が登録されていません。<br>小説を読んで、気になる単語をタップして登録しましょう。</div>
        <div style="margin-top: 20px;">
            <button onclick="Yomu.showBookList()"
                style="padding: 10px 20px; border: 2px solid #000; background: #fff; font-weight: bold; cursor: pointer;">←
                書籍一覧へ</button>
        </div>
    </div>

    <!-- ===== 词义弹出卡片 ===== -->
    <div id="popup-overlay" class="popup-overlay hidden" onclick="Yomu.closePopup()"></div>
    <div id="popup-card" class="popup-card hidden">
        <div class="popup-word" id="popup-word"></div>
        <div class="popup-reading" id="popup-reading"></div>
        <div class="popup-pos" id="popup-pos"></div>
        <div class="popup-meta" id="popup-meta"></div>
        <div class="popup-meaning" id="popup-meaning"></div>
        <div class="popup-actions">
            <button onclick="Yomu.closePopup()">閉じる</button>
            <button class="primary" id="btn-mark-word" onclick="Yomu.toggleMark()">単語帳に追加</button>
        </div>
    </div>

    <!-- ===== 底部工具栏 ===== -->
    <div id="bottom-bar" class="bottom-bar">
        <div class="bar-left">
            <button id="btn-home" onclick="Yomu.showBookList()" title="ホーム">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </button>
            <button id="btn-settings" onclick="Yomu.toggleSettings()" title="設定">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" id="circle12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" id="path12" /></svg>
            </button>
        </div>
        <div class="bar-center">
            <span id="progress-text">0%</span>
        </div>
        <div class="bar-right">
            <button id="btn-vocab" class="reader-only" onclick="Yomu.showVocab()" title="単語帳">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </button>
            <button class="reader-only" onclick="Yomu.reader.scrollTop()" title="最初へ">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </button>
        </div>
    </div>

    <div id="settings-overlay" class="settings-overlay"></div>
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h2>メニュー</h2>
            <div style="display: flex; gap: 10px;">
                <button class="menu-btn" onclick="Yomu.showBookList()" title="ホーム">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </button>
                <button class="close-btn" onclick="Yomu.toggleSettings()">×</button>
            </div>
        </div>

        <div class="settings-group">
            <label>フォント</label>
            <div class="font-btn-group">
                <button class="font-btn active" data-font="mincho" onclick="Yomu.setFont('mincho')">明朝体</button>
                <button class="font-btn" data-font="gothic" onclick="Yomu.setFont('gothic')">ゴシック</button>
            </div>
        </div>

        <div class="settings-group">
            <label>文字サイズ</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustFontSize(-1)">-</button>
                <input type="range" id="font-size-slider" min="14" max="32" value="20"
                    oninput="Yomu.setFontSize(this.value)">
                <button class="step-btn" onclick="Yomu.adjustFontSize(1)">+</button>
                <span class="value-display" id="font-size-value" style="display: none;">20px</span>
            </div>
        </div>

        <div class="settings-group">
            <label>行間</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustLineHeight(-1)">-</button>
                <input type="range" id="line-height-slider" min="15" max="35" value="22"
                    oninput="Yomu.setLineHeight(this.value)">
                <button class="step-btn" onclick="Yomu.adjustLineHeight(1)">+</button>
                <span class="value-display" id="line-height-value" style="display: none;">2.2</span>
            </div>
        </div>

        <div class="settings-group">
            <label>ふりがな表示</label>
            <select id="furigana-mode-select" class="settings-select" onchange="Yomu.setFuriganaMode(this.value)">
                <option value="none">不表示</option>
                <option value="internal">内置</option>
                <option value="nlp">Kuromoji.js</option>
            </select>
        </div>



        <div class="settings-group">
            <label>データ同期</label>
            <div style="text-align: right;">
                <button class="font-btn" onclick="Yomu.syncData()">同期する</button>
            </div>
        </div>

        <div class="settings-group">
            <label>バージョン</label>
            <span id="settings-version" style="font-size: 12px; font-weight: bold; color: #000;">v1.0.0</span>
        </div>
    </div>

    <!-- Reusable Custom Modal (OpenJLPT style) -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title">通知</h2>
            <p id="modal-message">内容</p>
            <div class="modal-footer" id="modal-footer">
                <button class="modal-btn" id="modal-cancel-btn">キャンセル</button>
                <button class="modal-btn primary" id="modal-ok-btn">確定</button>
            </div>
        </div>
    </div>


    <!-- JS Modules -->
    <script src="libs/kuromoji.js"></script>
    <script src="js/storage.js?v=2"></script>
    <script src="js/dictionary.js?v=2"></script>
    <script src="js/tokenizer.js?v=2"></script>
    <script src="js/reader.js?v=2"></script>
    <script src="js/aozora.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>

</html>
