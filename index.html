<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Yomu - 日語読書器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/app_icon.svg">
    <link rel="apple-touch-icon" href="assets/app_icon.png">
    <link rel="stylesheet" href="css/style.css?v=17">

    <script>
        // PWA: register service worker for offline reading (http/https only;
        // Android WebView file:// builds skip this gracefully).
        if ('serviceWorker' in navigator &&
            (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err =>
                    console.warn('SW registration skipped:', err.message));
            });
        }
    </script>

</head>

<body>

    <!-- Loading -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loading-msg">辞書を読み込み中...</div>
    </div>

    <!-- ===== Shared Header (Bookshelf & Store) ===== -->
    <div id="main-header" class="book-list-header main-header-container">
        <h1 id="main-title">読書器</h1>
        <div class="header-actions">
            <button id="btn-show-store" class="icon-btn" onclick="Yomu.showStore()" title="書庫" aria-label="書庫">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </button>
            <button id="btn-show-library" class="icon-btn hidden" onclick="Yomu.back()" title="戻る" aria-label="戻る">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <!-- ===== 书籍列表 ===== -->
    <div id="book-list-view" class="book-list-view">
        <div class="home-filter-panel" id="home-filter-panel">
            <div class="store-search home-search">
                <input type="text" id="home-search-input" placeholder="書架内を検索（作品名・著者名）..."
                    autocomplete="off">
                <button class="icon-btn-small import-btn" onclick="Yomu.pickLocalFile()" title="ファイルから追加 (.txt / .epub)"
                    aria-label="ファイルから追加">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
            </div>
            <input type="file" id="local-file-input" accept=".txt,.text,.epub" class="hidden" onchange="Yomu.onLocalFilePicked(this)">
            <div class="home-filter-main">
                <div class="filter-chips-group" id="home-filter-chips"></div>
                <div class="home-pagination-header">
                    <span id="home-page-info">1 / 1</span>
                    <div class="header-pagination-btns">
                        <button class="icon-btn-small" onclick="Yomu.prevHomePage()" id="btn-home-prev-header">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        </button>
                        <button class="icon-btn-small" onclick="Yomu.nextHomePage()" id="btn-home-next-header">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </div>
            </div>
            <div class="filter-summary" id="home-filter-summary"></div>
            <div class="filter-summary" id="home-fulltext-status" aria-live="polite"></div>
        </div>
        <div id="book-grid" class="book-grid home-adaptive-grid"></div>


    </div>

    <!-- ===== 书库 (Store) ===== -->
    <div id="store-view" class="store-view hidden">
        <div class="store-search">
            <input type="text" id="store-search-input" placeholder="作品名、著者名で検索..."
                autocomplete="off">
        </div>
        <button id="store-filter-toggle" class="store-filter-toggle" onclick="Yomu.toggleStoreFilters(event)"
            aria-expanded="false">絞り込み<span class="active-filter-count" id="store-active-filter-count"></span></button>
        <div class="store-filter-panel collapsed" id="store-filter-panel">
            <div class="filter-group" id="filter-authors"></div>
            <div class="filter-group" id="filter-categories"></div>
            <div class="filter-group" id="filter-orthographies"></div>
            <div class="filter-summary" id="store-filter-summary"></div>
        </div>
        <div id="store-grid" class="book-grid home-adaptive-grid"></div>

        <div class="pagination-bar">
            <button onclick="Yomu.prevStorePage()" id="btn-prev-page" class="page-btn">前へ</button>
            <button onclick="Yomu.nextStorePage()" id="btn-next-page" class="page-btn">次へ</button>
        </div>
    </div>

    <!-- ===== 阅读器 ===== -->
    <div id="reader-view" class="reader-view">
        <div class="reader-header">
            <div>
                <h1 id="reader-title"></h1>
                <div class="author" id="reader-author"></div>
            </div>
        </div>
        <div id="book-frontmatter" class="book-frontmatter"></div>
        <div id="novel-content" class="novel-text font-mincho"></div>

        <div id="reader-progress-bar" aria-hidden="true"><div id="reader-progress-fill"></div></div>

        <button id="back-to-top-btn" onclick="Yomu.scrollToTop()" title="先頭へ戻る" aria-label="先頭へ戻る">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </button>

        <!-- Edge tap paging zones (enabled via settings) -->
        <div id="tap-zone-left" class="tap-zone" aria-hidden="true"></div>
        <div id="tap-zone-right" class="tap-zone" aria-hidden="true"></div>

        <button id="reader-back-btn" class="reader-back-btn" onclick="Yomu.back()" title="戻る" aria-label="戻る">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>

        <!-- Table of Contents -->
        <button id="toc-btn" class="toc-btn" onclick="Yomu.toggleToc(event)" title="目次" aria-label="目次">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="14" y2="18"></line>
            </svg>
        </button>
        <div id="toc-overlay" class="toc-overlay" onclick="Yomu.closeToc()"></div>
        <div id="toc-panel" class="toc-panel" role="dialog" aria-label="目次">
            <div class="toc-header">
                <h2>目次</h2>
                <button class="close-btn" onclick="Yomu.closeToc()" aria-label="閉じる">×</button>
            </div>
        <div id="toc-bookmarks" class="toc-bookmarks"></div>
            <div id="toc-list" class="toc-list"></div>
        </div>

        <!-- Minimalist Status Bar -->
        <div id="reader-status-bar" class="reader-status-bar">
            <div class="status-left u-cursor-pointer" onclick="Yomu.toggleBookInfoCard(event)">
                <span id="status-title"></span> · <span id="status-author"></span>
            </div>
            <div class="status-right">
                <span id="status-progress">0%</span>
                <button class="status-icon-btn" id="wordbook-btn" onclick="YomuWordbook.toggle()" title="単語帳" aria-label="単語帳">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2l2.4 6.3 6.6.4-5.1 4.3 1.7 6.4L12 15.9l-5.6 3.5 1.7-6.4L3 8.7l6.6-.4z"></path>
                    </svg>
                </button>
                <button class="status-icon-btn" id="autoscroll-btn" onclick="Yomu.toggleAutoScroll()" title="自動スクロール" aria-label="自動スクロール">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="6 3 13 12 6 21 6 3" fill="currentColor" stroke="none"></polygon>
                        <line x1="16" y1="4" x2="16" y2="20"></line>
                    </svg>
                </button>
                    <button class="status-icon-btn" id="immersive-toggle-btn" onclick="Yomu.toggleImmersive(event)" title="沉浸モード" aria-label="沉浸モード">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                        </svg>
                    </button>
                <button class="status-settings-btn" onclick="Yomu.toggleSettingsFromButton(event)" title="設定"
                    aria-label="設定">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M12 0c-1.3 0-2.3.9-2.7 2.1-.8.2-1.6.5-2.3 1-1.1-.7-2.6-.4-3.5.5-.9.9-1.2 2.4-.5 3.5-.5.7-.8 1.5-1 2.3-1.2.4-2.1 1.4-2.1 2.7s.9 2.3 2.1 2.7c.2.8.5 1.6 1 2.3-.7 1.1-.4 2.6.5 3.5.9.9 2.4 1.2 3.5.5.7.5 1.5.8 2.3 1 0.4 1.2 1.4 2.1 2.7 2.1s2.3-.9 2.7-2.1c.8-.2 1.6-.5 2.3-1 1.1.7 2.6.4 3.5-.5.9-.9 1.2-2.4.5-3.5.5-.7.8-1.5 1-2.3 1.2-.4 2.1-1.4 2.1-2.7s-.9-2.3-2.1-2.7c-.2-.8-.5-1.6-1-2.3.7-1.1.4-2.6-.5-3.5-.9-.9-2.4-1.2-3.5-.5-.7-.5-1.5-.8-2.3-1-.4-1.2-1.4-2.1-2.7-2.1zm0 7.5c2.5 0 4.5 2 4.5 4.5s-2 4.5-4.5 4.5-4.5-2-4.5-4.5 2-4.5 4.5-4.5z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Book Info Card (Floating) -->
        <div id="book-info-card" class="book-info-card">
            <div class="card-label">Reading</div>
            <div id="card-title" class="card-title"></div>
            <div id="card-author" class="card-author"></div>

            <!-- Detailed Metadata Grid -->
            <div id="card-metadata" class="frontmatter-grid card-metadata"></div>

            <!-- Card Footer (Links) -->
            <div id="card-footer" class="card-footer"></div>
        </div>
    </div>

        <!-- B1: Wordbook panel -->
        <div id="wordbook-overlay" class="toc-overlay" onclick="YomuWordbook.close()"></div>
        <div id="wordbook-panel" class="toc-panel wordbook-panel" role="dialog" aria-label="単語帳">
            <div class="toc-header">
                <h2>単語帳</h2>
                <button class="close-btn" onclick="YomuWordbook.close()" aria-label="閉じる">×</button>
            </div>
            <div id="wordbook-count" class="wordbook-count"></div>
            <div id="wordbook-list" class="wordbook-list"></div>
            <div class="wordbook-footer">
                <button class="wordbook-action-btn" onclick="YomuWordbook.exportJSON()">エクスポート</button>
                <button class="wordbook-action-btn" onclick="document.getElementById('wordbook-import-file').click()">インポート</button>
                <input type="file" id="wordbook-import-file" accept="application/json,.json" class="hidden" onchange="YomuWordbookImport(this)">
            </div>
        </div>

    <div id="settings-overlay" class="settings-overlay"></div>
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h2>メニュー</h2>
            <div class="u-display-flex u-gap-10">
                <button class="close-btn" onclick="Yomu.toggleSettingsFromButton(event)">×</button>
            </div>
        </div>

        <div class="settings-group settings-group-column font-pair-group">
            <label>フォント</label>
            <div class="font-preset-btn-group" role="group" aria-label="プリセット">
                <button class="font-btn font-preset-btn" data-preset="mincho" onclick="Yomu.applyFontPreset('mincho')">明朝経典</button>
                <button class="font-btn font-preset-btn" data-preset="textbook" onclick="Yomu.applyFontPreset('textbook')">教科書柔和</button>
                <button class="font-btn font-preset-btn" data-preset="maru" onclick="Yomu.applyFontPreset('maru')">圆体輕鬆</button>
            </div>
            <div class="font-pair-row">
                <label class="font-pair-label">漢字</label>
                <div class="font-pair-control">
                    <select id="font-kanji-select" class="settings-select font-pair-select"
                        onchange="Yomu.onFontSelect('kanji', this.value)"></select>
                    <div class="font-sample" id="font-sample-kanji">永遠の約束 かな カナ 123</div>
                </div>
            </div>
            <div class="font-pair-row">
                <label class="font-pair-label">かな</label>
                <div class="font-pair-control">
                    <select id="font-kana-select" class="settings-select font-pair-select"
                        onchange="Yomu.onFontSelect('kana', this.value)"></select>
                    <div class="font-sample" id="font-sample-kana">永遠の約束 かな カナ 123</div>
                </div>
            </div>
            <div id="font-combo-preview" class="font-combo-preview">吾輩は猫である。名字 123 ABC</div>
        </div>

        <div class="settings-group">
            <label>文字サイズ</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustFontSize(-1)">-</button>
                <input type="range" id="font-size-slider" min="14" max="32" value="20"
                    oninput="Yomu.setFontSize(this.value)">
                <button class="step-btn" onclick="Yomu.adjustFontSize(1)">+</button>
                <span class="value-display u-display-none" id="font-size-value">20px</span>
            </div>
        </div>

        <div class="settings-group">
            <label>行間</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustLineHeight(-1)">-</button>
                <input type="range" id="line-height-slider" min="15" max="35" value="22"
                    oninput="Yomu.setLineHeight(this.value)">
                <button class="step-btn" onclick="Yomu.adjustLineHeight(1)">+</button>
                <span class="value-display u-display-none" id="line-height-value">2.2</span>
            </div>

        </div>

        <div class="settings-group">
            <label>ページ余白</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustMargin(-4)">-</button>
                <input type="range" id="margin-slider" min="8" max="48" step="2" value="20"
                    oninput="Yomu.setMargin(this.value)">
                <button class="step-btn" onclick="Yomu.adjustMargin(4)">+</button>
                <span class="value-display u-display-none" id="margin-value">20px</span>
            </div>
        </div>

        <div class="settings-group">
            <label>背景色</label>
            <div class="theme-btn-group" role="group" aria-label="背景色">
                <button class="theme-btn theme-light active" data-theme="light" onclick="Yomu.setTheme('light')" aria-label="白"><span></span>白</button>
                <button class="theme-btn theme-sepia" data-theme="sepia" onclick="Yomu.setTheme('sepia')" aria-label="米黄"><span></span>米黄</button>
                <button class="theme-btn theme-green" data-theme="green" onclick="Yomu.setTheme('green')" aria-label="緑"><span></span>緑</button>
                <button class="theme-btn theme-dark" data-theme="dark" onclick="Yomu.setTheme('dark')" aria-label="黒"><span></span>黒</button>
            </div>
        </div>

        <div class="settings-group">
            <label>明るさ</label>
            <div class="control-row">
                <button class="step-btn" onclick="Yomu.adjustBrightness(-10)">-</button>
                <input type="range" id="brightness-slider" min="50" max="100" step="5" value="100"
                    oninput="Yomu.setBrightness(this.value)">
                <button class="step-btn" onclick="Yomu.adjustBrightness(10)">+</button>
            </div>
        </div>

        <div class="settings-group settings-group-column">
            <label>読書操作</label>
            <label class="switch-row">
                <span>画面端タップでページめくり</span>
                <span class="switch"><input type="checkbox" id="edge-tap-toggle" onchange="Yomu.setEdgeTap(this.checked)"><span class="slider-round"></span></span>
            </label>
        </div>

        <div class="settings-group">
            <label>ふりがな表示</label>
            <select id="furigana-mode-select" class="settings-select" onchange="Yomu.setFuriganaMode(this.value)">
                <option value="none">不表示</option>
                <option value="internal">内置</option>
                <option value="nlp">Kuromoji.js</option>
            </select>
        </div>

        <div class="settings-group settings-group-column">
            <label>レイアウト</label>
            <label class="switch-row">
                <span>縦書きで読む</span>
                <span class="switch"><input type="checkbox" id="vertical-reading-toggle" onchange="Yomu.setVerticalReading(this.checked)"><span class="slider-round"></span></span>
            </label>
            <label class="switch-row">
                <span>タブレットで2段組（≥768px）</span>
                <span class="switch"><input type="checkbox" id="two-column-toggle" onchange="Yomu.setTwoColumn(this.checked)"><span class="slider-round"></span></span>
            </label>
            <label class="switch-row">
                <span>画面端タップでページめくり</span>
                <span class="switch"><input type="checkbox" id="edge-tap-toggle" onchange="Yomu.setEdgeTap(this.checked)"><span class="slider-round"></span></span>
            </label>
            <label class="switch-row">
                <span>JLPT 難度表示（辞書ポップアップ）</span>
                <span class="switch"><input type="checkbox" id="jlpt-show-toggle" onchange="Yomu.setJlptShow(this.checked)"><span class="slider-round"></span></span>
            </label>
            <label class="switch-row">
                <span>自動スクロール速度</span>
                <select class="settings-select settings-select-inline" onchange="Yomu.setAutoScrollSpeed(this.value)">
                    <option value="slow">遅い</option>
                    <option value="normal" selected>普通</option>
                    <option value="fast">速い</option>
                </select>
            </label>
        </div>

        <div class="settings-group settings-group-column">
            <label>AI 翻訳（任意・自带キー）</label>
            <div class="ai-config-row">
                <select id="ai-provider-select" class="settings-select" onchange="Yomu.onAiProviderChange(this.value)">
                    <option value="zhipu">智谱AI (GLM)</option>
                    <option value="kimi">Kimi (Moonshot)</option>
                    <option value="ark">火山ARK</option>
                    <option value="custom">自定义 / 本地代理</option>
                </select>
                <input type="url" id="ai-baseurl-input" class="settings-input" placeholder="Base URL（例: http://localhost:11434/v1）" onchange="Yomu.saveAiConfig()">
                <input type="text" id="ai-model-input" class="settings-input" placeholder="モデル名" onchange="Yomu.saveAiConfig()">
                <input type="password" id="ai-key-input" class="settings-input" placeholder="API キー（本地代理可留空）" autocomplete="off" onchange="Yomu.saveAiConfig()">
            </div>
            <p class="ai-config-note">キーは本端末のみ保存され、バックアップにも含まれません。</p>
        </div>

        <div class="settings-group settings-group-column">
            <label>読書統計</label>
            <div id="reading-stats" class="reading-stats"></div>
        </div>

        <div class="settings-group settings-group-column">
            <label>データバックアップ（読書データ一括）</label>
            <div class="backup-row">
                <button class="settings-btn" type="button" onclick="Yomu.exportBackup()">書き出し</button>
                <button class="settings-btn" type="button" onclick="document.getElementById('backup-file-input').click()">読み込み</button>
                <input type="file" id="backup-file-input" accept=".json,application/json" class="hidden" onchange="Yomu.importBackup(this)">
            </div>
        </div>

        <div class="settings-group settings-group-column">
            <label>データ初期化</label>
            <div class="u-text-align-right">
                <button class="font-btn" onclick="Yomu.clearAllData()">全て削除</button>
            </div>
        </div>

        <div class="settings-group">
            <label>バージョン</label>
            <span id="settings-version" class="version-tag">v1.0.0</span>
        </div>
    </div>

    <!-- Reusable Custom Modal (OpenJLPT style) -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title">通知</h2>
            <p id="modal-message">内容</p>
            <div class="modal-footer" id="modal-footer">
                <button class="modal-btn" id="modal-cancel-btn">キャンセル</button>
                <button class="modal-btn primary" id="modal-ok-btn">確定</button>
            </div>
        </div>
    </div>

    <div class="library-footer global-footer">
        <p>青空文庫より <span id="library-count">0</span> 冊を所蔵</p>
        <a class="github-footer-link" href="https://github.com/iamcheyan/yomu" target="_blank"
            rel="noopener noreferrer">
