plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yomu.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.yomu.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// 编译前自动同步 Web 文件到 assets
task syncWebAssets(type: Copy) {
    from('../../') {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'libs/**'
        include 'assets/**'
        include 'manifest.json'
        
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'libs/**'
        include 'assets/**'
        include 'manifest.json'
        
        // 核心数据文件
        include 'data/books.json'
        include 'data/aozora_catalog.json'
        
        // 打包 50 本精选名著
        include 'data/novels/rashomon.json'
        include 'data/novels/hashire_melos.json'
        include 'data/novels/bocchan.json'
        include 'data/novels/sangetsuki.json'
        include 'data/novels/mai_hime.json'
        include 'data/novels/ningen_shikkaku.json'
        include 'data/novels/kokoro.json'
        include 'data/novels/gingatetsudo.json'
        include 'data/novels/kumo_no_ito.json'
        include 'data/novels/kazetachinu.json'
        include 'data/novels/lemon.json'
        include 'data/novels/yodaka_no_hoshi.json'
        include 'data/novels/takasebune.json'
        include 'data/novels/gakumon_no_susume.json'
        include 'data/novels/wagahai_neko.json'
        include 'data/novels/sanshiro.json'
        include 'data/novels/chumon_ryori.json'
        include 'data/novels/taketori.json'
        include 'data/novels/futon.json'
        include 'data/novels/takekurabe.json'
        include 'data/novels/musashino.json'
        include 'data/novels/ukigumo.json'
        include 'data/novels/kingin_yakusha.json'
        include 'data/novels/sansho_dayu.json'
        include 'data/novels/daidoji_shinsuke.json'
        include 'data/novels/shunkinsho.json'
        include 'data/novels/sasameyuki.json'
        include 'data/novels/gan.json'
        include 'data/novels/izunodori.json'
        include 'data/novels/viyon_no_tsuma.json'
        include 'data/novels/fugaku_hyakkei.json'
        include 'data/novels/tsugaru.json'
        include 'data/novels/hana.json'
        include 'data/novels/imo_gayu.json'
        include 'data/novels/yabu_no_naka.json'
        include 'data/novels/jigokuhen.json'
        include 'data/novels/kappa.json'
        include 'data/novels/aru_aho.json'
        include 'data/novels/michi_kusa.json'
        include 'data/novels/yume_juya.json'
        include 'data/novels/kusa_makura.json'
        include 'data/novels/to_shun.json'
        include 'data/novels/nankin_no_kirisuto.json'
        include 'data/novels/meian.json'
        include 'data/novels/urashima.json'
        include 'data/novels/issun_boshi.json'
        include 'data/novels/momotaro.json'
        include 'data/novels/yuki_onna.json'
        include 'data/novels/ko_no_takane.json'
        include 'data/novels/serohiki_no_goshu.json'
    }
    into 'src/main/assets'
    // 确保每次编译都是最新的
    outputs.upToDateWhen { false }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn syncWebAssets
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
