plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yomu.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.yomu.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def webAssetOutputDir = layout.projectDirectory.dir('src/main/assets')

// 编译前自动同步 Web 文件到 assets
tasks.register('syncWebAssets', Copy) {
    from('../../') {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'libs/**'
        include 'assets/**'
        include 'manifest.json'

        // 核心数据文件
        include 'data/books.json'
        include 'data/aozora_catalog.json'

        // 打包 20 本精选名著
        include 'data/novels/rashomon.json'
        include 'data/novels/hashire_melos.json'
        include 'data/novels/bocchan.json'
        include 'data/novels/sangetsuki.json'
        include 'data/novels/mai_hime.json'
        include 'data/novels/ningen_shikkaku.json'
        include 'data/novels/kokoro.json'
        include 'data/novels/gingatetsudo.json'
        include 'data/novels/kumo_no_ito.json'
        include 'data/novels/kazetachinu.json'
        include 'data/novels/lemon.json'
        include 'data/novels/yodaka_no_hoshi.json'
        include 'data/novels/takasebune.json'
        include 'data/novels/gakumon_no_susume.json'
        include 'data/novels/wagahai_neko.json'
        include 'data/novels/sanshiro.json'
        include 'data/novels/chumon_ryori.json'
        include 'data/novels/taketori.json'
        include 'data/novels/izunodori.json'
        include 'data/novels/yuki_onna.json'
    }
    into webAssetOutputDir
    doFirst {
        delete webAssetOutputDir
    }
    // 确保每次编译都是最新的
    outputs.upToDateWhen { false }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn syncWebAssets
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
