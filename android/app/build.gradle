plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yomu.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.yomu.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def webAssetOutputDir = layout.projectDirectory.dir('src/main/assets')
// 编译前自动同步 Web 文件到 assets。
// 注意：id 以 data/books.json 为准（canonical fileId）；带别名的历史 slug
// 文件一并打包，保证旧进度/离线数据仍可打开。
def bundledBookIds = [
    '18340_ruby_13244', 'hashire_melos', '752_ruby_2438', '624_ruby_5668', 'sangetsuki', 'mai_hime',
    '301_ruby_5915', '773_ruby_5968', 'kokoro', '456_ruby_145', 'gingatetsudo',
    '92_ruby_164', 'kumo_no_ito', '4803_ruby_14149', 'kazetachinu',
    '424_ruby_19825', '473_ruby_467', 'yodaka_no_hoshi', 'takasebune', 'gakumon_no_susume',
    '789_ruby_5639', 'wagahai_neko', '794_ruby_4237', '43754_ruby_17594', 'chumon_ryori',
    '48310_ruby_42452', 'izunodori', 'yuki_onna'
]

// 编译前自动同步 Web 文件到 assets
tasks.register('syncWebAssets', Copy) {
    from('../../') {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'libs/kuromoji.js'
        include 'assets/**'
        include 'manifest.json'

        // 核心数据文件
        include 'data/books.json'
        include 'data/version.json'
        include 'data/aozora_catalog_preview.json'
        include 'data/aozora_catalog_compact.json'
        // include 'libs/dict/*.dat.gz' // Removed to reduce APK size; downloaded at runtime instead

        // 打包首页精选书目
        bundledBookIds.each { bookId ->
            include "data/novels/${bookId}.json"
        }
    }
    into webAssetOutputDir
    doFirst {
        delete webAssetOutputDir
    }
    // 确保每次编译都是最新的
    outputs.upToDateWhen { false }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn syncWebAssets
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
