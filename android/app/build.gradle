plugins {
    id 'com.android.application'
}

import groovy.json.JsonSlurper

android {
    namespace 'com.yomu.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.yomu.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def webAssetOutputDir = layout.projectDirectory.dir('src/main/assets')
def bundledBookIds = new JsonSlurper()
        .parse(file('../../data/books.json'))
        .collect { it.id }

// 编译前自动同步 Web 文件到 assets
tasks.register('syncWebAssets', Copy) {
    from('../../') {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'libs/**'
        include 'assets/**'
        include 'manifest.json'

        // 核心数据文件
        include 'data/books.json'
        include 'data/aozora_catalog_preview.json'
        include 'data/aozora_catalog_compact.json'

        // 打包首页精选书目
        bundledBookIds.each { bookId ->
            include "data/novels/${bookId}.json"
        }
    }
    into webAssetOutputDir
    doFirst {
        delete webAssetOutputDir
    }
    // 确保每次编译都是最新的
    outputs.upToDateWhen { false }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn syncWebAssets
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
